# ============================================================
# DeliveryOS — Nginx Reverse Proxy + Frontend Flutter Web
# HTTPS / SSL Ativado
# ============================================================

# Compressão gzip para performance
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
gzip_min_length 1000;
gzip_vary on;

# Rate limiting básico
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Upstream do Backend Dart Frog
upstream backend_api {
    server backend:8080;
}

# ─── Redirecionamento HTTP para HTTPS ───────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ─── Servidor HTTPS Principal ───────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # Certificados SSL Let's Encrypt mapeados do host
    ssl_certificate /etc/letsencrypt/live/54.221.132.160.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54.221.132.160.sslip.io/privkey.pem;

    # Otimizações de SSL
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # ─── Headers de Segurança ───────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── Frontend Flutter Web (Arquivos Estáticos) ──────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── API Backend (Reverse Proxy para Dart Frog) ─────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ─── Health Check Endpoint ──────────────────────────────────
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ─── Permite acesso ao .env do Flutter (asset empacotado) ──
    location = /assets/.env {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # ─── Bloqueia acesso a outros arquivos sensíveis ────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
