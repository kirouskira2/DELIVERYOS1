name: delivery_os
description: Sistema de Gestão para Restaurantes e Delivery — Prisma V4.0
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Autenticação e Banco de Dados
  supabase_flutter: ^2.5.0

  # Navegação
  go_router: ^14.0.0

  # Gráficos animados (Dashboard de KPIs)
  fl_chart: ^0.68.0

  # Ícones estilo Lucide (equivalente ao lucide-react)
  lucide_flutter: ^1.14.0
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  provider: ^6.1.1
  shimmer: ^3.0.0
  dio: ^5.9.2
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

# Configuração do ícone do launcher
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#020617"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

# Configuração da splash screen nativa
flutter_native_splash:
  color: "#020617"
  image: "assets/icon/app_icon.png"
  android: true
  ios: false
  android_12:
    color: "#020617"
    icon_background_color: "#020617"
    image: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
