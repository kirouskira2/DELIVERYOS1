# ============================================================
# DeliveryOS — Docker Compose (Orquestrador de Infraestrutura)
# 
# Arquitetura com HTTPS ativado:
#   [Usuário] → :443 (SSL) → [Nginx] → /api/* → [Backend :8080]
#                                    → /*     → [Frontend :3000]
# ============================================================

services:
  # ─── Backend API (Dart Frog) ────────────────────────────────
  backend:
    build:
      context: ./backend_dart
      dockerfile: Dockerfile
    container_name: deliveryos-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - DART_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - deliveryos-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Nginx (Reverse Proxy + Frontend) ──────────────────────
  nginx:
    image: nginx:alpine
    container_name: deliveryos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend_build:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - deliveryos-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─── Rede Isolada ────────────────────────────────────────────
networks:
  deliveryos-network:
    driver: bridge
